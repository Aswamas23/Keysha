<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Keysha</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌹</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <audio id="bgMusic" preload="auto"></audio>

  <!-- ═══ CURTAIN ═══ -->
  <div id="curtain-overlay">
    <div id="curtain-left"></div>
    <div id="curtain-right"></div>
    <div id="curtain-text">
      <p class="curtain-main">A little something for you&hellip;</p>
      <p class="curtain-sub">Click anywhere to begin.</p>
    </div>
  </div>

  <!-- ═══ NEWSPAPER ═══ (hidden until curtain opens) -->
  <div id="newspaper-wrap" style="display:none">
    <div id="newspaper-inner">
      <header id="newspaper-header">
        <div class="nph-rule"></div>
        <div class="nph-row">
          <span class="nph-meta">Vol. I &mdash; 2026</span>
          <h1 class="nph-title">THE RUNWAY GAZETTE</h1>
          <span class="nph-meta">Special Edition</span>
        </div>
        <div class="nph-rule"></div>
      </header>

      <!-- The single page always visible -->
      <div id="page-stage">
        <div id="page-a" class="np-page"></div>
        <div id="page-b" class="np-page np-page--hidden"></div>
      </div>

      <footer id="newspaper-footer">
        <span id="pg-prev" class="pg-arrow" role="button" tabindex="0" aria-label="Previous page">&#8592; Prev</span>
        <span id="pg-num">1 / 11</span>
        <span id="pg-next" class="pg-arrow" role="button" tabindex="0" aria-label="Next page">Next &#8594;</span>
      </footer>
    </div>
  </div>

  <!-- ═══ VIDEO SECTION ═══ -->
  <div id="video-wrap" style="display:none">
    <p id="video-label" class="video-label"></p>
    <video id="main-video" playsinline controls></video>
    <p class="video-hint">tap video to skip &rarr;</p>
  </div>

  <!-- ═══ APOLOGY ═══ -->
  <div id="apology-wrap" style="display:none">
    <div id="apology-inner">
      <h2 id="apo-recipient"></h2>
      <div id="apo-body"></div>
      <p  id="apo-sig" class="apo-sig"></p>
      <div id="apo-orn">&#10022;</div>
    </div>
  </div>

  <!-- Black fade overlay -->
  <div id="fade-overlay"></div>

  <!-- Floating music widget -->
  <div id="music-widget" style="display:none">
    <button id="music-btn" aria-label="Pause">&#9646;&#9646;</button>
    <input  id="vol-slider" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="Volume">
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
